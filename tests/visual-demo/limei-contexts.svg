<text x="810" y="184" fill="#9a7477" font-size="13">Action required</text>

<rect x="400" y="250" width="780" height="370" rx="7" fill="#101010" stroke="#393632"/>
<rect x="400" y="250" width="780" height="38" rx="7" fill="#171717"/>
